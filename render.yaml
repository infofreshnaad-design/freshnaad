services:
  - type: web
    name: freshnaad-pos
    runtime: node
    plan: free
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 20.18.0
      - key: DATABASE_URL
        sync: false # Set your Supabase connection string in Render Dashboard
      - key: DIRECT_URL
        sync: false # Set your Direct Supabase connection string in Render Dashboard
      - key: JWT_SECRET
        sync: false # Set your JWT Secret in Render Dashboard
      - key: NODE_ENV
        value: production

